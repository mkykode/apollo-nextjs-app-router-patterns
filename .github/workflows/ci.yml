name: CI

on:
  push:
    branches: [dynamic, use-cache]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm vitest run
      - run: pnpm build
        # Better Auth refuses the default secret in a production build, and `next build` sets
        # NODE_ENV=production. Nothing signed here is ever served, so a fixed value is fine.
        env:
          BETTER_AUTH_SECRET: ci-build-only-secret-at-least-32-chars
